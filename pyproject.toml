[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minrl"
version = "0.2.0"
description = "Clean, minimal implementations of fundamental reinforcement learning algorithms in GridWorld"
readme = "README.md"
authors = [
    {name = "Leon", email = "yibin.leon.liu@outlook.com"}
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.2,<3",
    "gymnasium>=1.0,<2",
    "matplotlib>=3.8,<4",
    "pyyaml>=6,<7"
]

[project.urls]
Homepage = "https://github.com/10-OASIS-01/minrl"
Repository = "https://github.com/10-OASIS-01/minrl.git"

[project.optional-dependencies]
experiments = ["tensorboard>=2.16,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9", "build>=1.2"]

[project.scripts]
minrl = "minrl.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["minrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
